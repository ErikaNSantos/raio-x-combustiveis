name: Atualizar dados e publicar

on:
  push:
    branches: [main]
  schedule:
    # Toda segunda às 9h de Brasília, três horas depois da base histórica ser atualizada
    # no portfólio. Se nenhum ano da base mudou, nada é reagregado e a página só é republicada.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Pipeline (só anos que mudaram na base)
        if: github.event_name != 'push'
        run: python -m pipeline.run

      - name: Versiona os dados novos
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data
          if git diff --cached --quiet; then
            echo "Nenhum dado novo."
          else
            git commit -m "Atualiza dados da ANP até $(python -c 'import json;print(json.load(open("site/data/resumo.json"))["periodos"][-1])')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
